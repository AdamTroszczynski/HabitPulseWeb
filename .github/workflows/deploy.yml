name: Deploy Frontend to VPS

on:
  push:
    branches:
      - preview
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Build Frontend Docker image
        run: |
          docker build --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} -f Dockerfile -t localhost:5000/habitpulse-web:latest .

      - name: Push and Deploy Frontend
        run: |
          ssh -L 5000:localhost:5000 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} -N -f
          sleep 3
          docker push localhost:5000/habitpulse-web:latest
          scp docker-compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/projects/habitpulse-web/docker-compose.yml
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd /opt/projects/habitpulse-web && docker pull localhost:5000/habitpulse-web:latest && docker compose up -d --pull never'
